version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: winhunter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: winhunter
      POSTGRES_PASSWORD: winhunter_password
      POSTGRES_DB: winhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winhunter"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: winhunter_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://winhunter:winhunter_password@db:5432/winhunter
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: winhunter_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:

